<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Owais Job Tracker — Saudi Arabia</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; color: #111; background: #f9f9f9; }
  header { background: #1a1a2e; color: #fff; padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
  header h1 { font-size: 18px; font-weight: 600; }
  header .meta { font-size: 12px; color: #aaa; }
  .cities { font-size: 12px; color: #9cf; }
  .toolbar { padding: 12px 24px; background: #fff; border-bottom: 1px solid #e5e5e5; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .toolbar input { padding: 6px 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; width: 220px; }
  .toolbar select { padding: 6px 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; }
  button { padding: 6px 14px; background: #1a1a2e; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 13px; }
  button:hover { background: #2d2d4e; }
  .count { font-size: 12px; color: #666; margin-left: auto; }
  table { width: 100%; border-collapse: collapse; }
  thead { background: #f0f0f0; }
  th { padding: 9px 12px; text-align: left; font-size: 12px; font-weight: 600; color: #444; text-transform: uppercase; letter-spacing: 0.04em; border-bottom: 2px solid #ddd; white-space: nowrap; }
  td { padding: 9px 12px; border-bottom: 1px solid #eee; vertical-align: middle; }
  tr:hover td { background: #fafafa; }
  .platform-pill { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; }
  .pill-linkedin { background: #e8f0fe; color: #1a56db; }
  .pill-bayt { background: #fce8d5; color: #b45309; }
  .pill-naukrigulf { background: #e8fce8; color: #166534; }
  .pill-glassdoor { background: #fef3c7; color: #92400e; }
  .pill-indeed { background: #fde8e8; color: #991b1b; }
  .city-pill { display: inline-block; padding: 2px 7px; border-radius: 10px; font-size: 11px; background: #f3f4f6; color: #374151; }
  .apply-link { color: #1a56db; text-decoration: none; font-weight: 500; }
  .apply-link:hover { text-decoration: underline; }
  #tableWrapper { overflow-x: auto; }
  .no-jobs { text-align: center; padding: 40px; color: #888; }
  .loading { text-align: center; padding: 40px; color: #888; }
</style>
</head>
<body>

<header>
  <div>
    <h1>Owais Job Tracker</h1>
    <div class="cities">&#128205; Riyadh &nbsp;|&nbsp; Jeddah &nbsp;|&nbsp; Dammam &nbsp;|&nbsp; Al Khobar</div>
  </div>
  <div class="meta">
    Sources: LinkedIn &bull; Bayt &bull; NaukriGulf &bull; Glassdoor<br>
    <span id="lastUpdated">Loading...</span>
  </div>
</header>

<div class="toolbar">
  <input type="text" id="search" placeholder="Search title, company..." oninput="filterTable()">
  <select id="cityFilter" onchange="filterTable()">
    <option value="">All Cities</option>
    <option value="Riyadh">Riyadh</option>
    <option value="Jeddah">Jeddah</option>
    <option value="Dammam">Dammam</option>
    <option value="Al Khobar">Al Khobar</option>
  </select>
  <select id="platformFilter" onchange="filterTable()">
    <option value="">All Platforms</option>
    <option value="LinkedIn">LinkedIn</option>
    <option value="Bayt">Bayt</option>
    <option value="NaukriGulf">NaukriGulf</option>
    <option value="Glassdoor">Glassdoor</option>
    <option value="Indeed">Indeed</option>
  </select>
  <button onclick="downloadExcel()">&#8595; Download Excel</button>
  <span class="count" id="count"></span>
</div>

<div id="tableWrapper">
  <div class="loading" id="loadingMsg">Loading jobs...</div>
  <table id="jobTable" style="display:none">
    <thead>
      <tr>
        <th>#</th>
        <th>Title</th>
        <th>Company</th>
        <th>City</th>
        <th>Platform</th>
        <th>Posted</th>
        <th>Apply</th>
      </tr>
    </thead>
    <tbody id="jobBody"></tbody>
  </table>
  <div class="no-jobs" id="noJobs" style="display:none">No jobs match your filter.</div>
</div>

<script>
let allJobs = [];

async function loadJobs() {
  try {
    const res = await fetch('data/jobs.json?_=' + Date.now());
    const data = await res.json();
    allJobs = data.jobs || [];
    document.getElementById('lastUpdated').textContent = 'Last updated: ' + new Date(data.lastUpdated).toLocaleString('en-SA', {timeZone:'Asia/Riyadh', day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit'}) + ' AST';
    renderTable(allJobs);
  } catch(e) {
    document.getElementById('loadingMsg').textContent = 'Failed to load jobs. Try refreshing.';
  }
}

function platformPill(p) {
  const cls = { LinkedIn:'pill-linkedin', Bayt:'pill-bayt', NaukriGulf:'pill-naukrigulf', Glassdoor:'pill-glassdoor', Indeed:'pill-indeed' };
  return `<span class="platform-pill ${cls[p]||''}">${p}</span>`;
}

function renderTable(jobs) {
  document.getElementById('loadingMsg').style.display = 'none';
  const tbody = document.getElementById('jobBody');
  if (!jobs.length) {
    document.getElementById('jobTable').style.display = 'none';
    document.getElementById('noJobs').style.display = 'block';
    document.getElementById('count').textContent = '0 jobs';
    return;
  }
  document.getElementById('noJobs').style.display = 'none';
  document.getElementById('jobTable').style.display = 'table';
  document.getElementById('count').textContent = jobs.length + ' job' + (jobs.length !== 1 ? 's' : '');
  tbody.innerHTML = jobs.map((j, i) => `
    <tr>
      <td>${i + 1}</td>
      <td><strong>${j.title}</strong></td>
      <td>${j.company}</td>
      <td><span class="city-pill">${j.city}</span></td>
      <td>${platformPill(j.platform)}</td>
      <td>${j.postedDate}</td>
      <td><a class="apply-link" href="${j.applyUrl}" target="_blank" rel="noopener">Apply &#8599;</a></td>
    </tr>
  `).join('');
}

function filterTable() {
  const q = document.getElementById('search').value.toLowerCase();
  const city = document.getElementById('cityFilter').value;
  const platform = document.getElementById('platformFilter').value;
  const filtered = allJobs.filter(j => {
    const matchQ = !q || j.title.toLowerCase().includes(q) || j.company.toLowerCase().includes(q);
    const matchCity = !city || j.city === city;
    const matchPlatform = !platform || j.platform === platform;
    return matchQ && matchCity && matchPlatform;
  });
  renderTable(filtered);
}

function downloadExcel() {
  const q = document.getElementById('search').value.toLowerCase();
  const city = document.getElementById('cityFilter').value;
  const platform = document.getElementById('platformFilter').value;
  const jobs = allJobs.filter(j => {
    const matchQ = !q || j.title.toLowerCase().includes(q) || j.company.toLowerCase().includes(q);
    const matchCity = !city || j.city === city;
    const matchPlatform = !platform || j.platform === platform;
    return matchQ && matchCity && matchPlatform;
  });
  const rows = [['#', 'Title', 'Company', 'City', 'Platform', 'Posted Date', 'Apply URL']];
  jobs.forEach((j, i) => rows.push([i+1, j.title, j.company, j.city, j.platform, j.postedDate, j.applyUrl]));
  const wb = XLSX.utils.book_new();
  const ws = XLSX.utils.aoa_to_sheet(rows);
  ws['!cols'] = [{wch:4},{wch:40},{wch:30},{wch:14},{wch:12},{wch:12},{wch:60}];
  XLSX.utils.book_append_sheet(wb, ws, 'Jobs');
  XLSX.writeFile(wb, 'owais_jobs_' + new Date().toISOString().slice(0,10) + '.xlsx');
}

loadJobs();
</script>

</body>
</html>
