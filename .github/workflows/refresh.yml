name: Sync

on:
  schedule:
    - cron: '0 5 * * *'   # 8:00 AM AST (Asia/Riyadh = UTC+3)
    - cron: '0 15 * * *'  # 6:00 PM AST (Asia/Riyadh = UTC+3)
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'data/**'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests
      - name: Verify Apify credentials
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN || secrets.AMIPFY || secrets.APIFY_API_TOKEN || secrets.APIFY_API_KEY || vars.APIFY_TOKEN }}
        run: |
          if [ -z "$APIFY_TOKEN" ]; then
            echo "::error::No Apify token found. Add a repository secret named APIFY_TOKEN (or AMIPFY) under Settings → Secrets and variables → Actions → Secrets (not Variables)."
            exit 1
          fi
          echo "Apify token is configured (${#APIFY_TOKEN} characters)."
      - name: Run update
        id: update
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN || secrets.AMIPFY || secrets.APIFY_API_TOKEN || secrets.APIFY_API_KEY || vars.APIFY_TOKEN }}
        run: python scripts/scraper.py
      - name: Commit and push
        run: |
          git config user.name "sync-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/items.json data/seen.json
          if git diff --staged --quiet; then
            echo "No changes — nothing to commit."
          else
            TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M UTC')
            git commit -m "Update data – ${TIMESTAMP}"
            git push
          fi
      - name: Fail if scrape did not run
        if: steps.update.outcome == 'failure'
        run: |
          echo "::error::Sync could not scrape new listings. Set the APIFY_TOKEN repository secret, then re-run the workflow."
          exit 1
